plugins {
	id 'net.fabricmc.fabric-loom' version '1.17.17'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.mod_id
}

repositories {
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	implementation(project(':pandorical'))

	// Optional: block-tip integration, compile-only and never bundled. Resolved by the version
	// block-tip declares rather than a version written down here, because Gradle never clears
	// build/libs: a name pinned by hand keeps compiling against a jar left behind by an old build
	// long after the real one has moved on, and says nothing when it does.
	def blockTipProperties = file("../block-tip/gradle.properties")
	if (blockTipProperties.exists()) {
		def blockTipVersion = new Properties().with {
			blockTipProperties.withInputStream { load(it) }
			getProperty("mod_version")
		}
		def blockTipJar = file("../block-tip/build/libs/block-tip-${blockTipVersion}.jar")
		if (blockTipJar.exists()) compileOnly files(blockTipJar)
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}
